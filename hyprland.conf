################
### MONITORS ###
################

# Your custom dual-monitor setup
# screen mirror lap right, extended screen left 
monitor=HDMI-A-1,preferred,0x0,1
monitor=eDP-1,preferred,1920x0,1

# monitor=,preferred,auto,auto


#screen mirror lap left extended screen right
 # monitor=eDP-1,preferred,auto,1

# screen mirror 
# monitor=HDMI-A-1,preferred,auto,1,mirror, eDP-1

###################
### MY PROGRAMS ###
###################

$terminal = kitty 
$fileManager = pcmanfm
$menu = rofi -show drun


#################
### AUTOSTART ###
#################

exec-once = waybar 
exec-once = swaync 
exec-once = hyprshot 
exec-once = hyprpaper
exec-once = /usr/lib/tumbler-1/tumblerd 

# Your battery notification loop
# exec-once = while true; do ~/.config/hypr/scripts/battery-notify.sh; sleep 300; done

# Idle and Lock management
exec-once = swayidle -w \
    timeout 300 'hyprlock & hyprctl dispatch dpms off' \
    resume 'hyprctl dispatch dpms on' \
    before-sleep 'hyprlock'

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 5 
    border_size = 1 

    col.active_border = rgba(94e2d5ee) rgba(45b19fee) 45deg
    col.inactive_border = rgba(151515aa) # Matches your dark Waybar island color

    resize_on_border = true 
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12 
    rounding_power = 2 

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 5
        render_power = 4 
        color = rgba(94e2d566) # Soft Mint glow
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = workspaces, 1, 1.94, almostLinear, fade
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0 

    touchpad {
        natural_scroll = true 
    }
}

# Your custom 3-finger gestures
gesture = 3, horizontal, workspace
gesture = 3, up, special 
gesture = 3, down, dispatcher, togglespecialworkspace 


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER 

# Main Binds
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = CTRL_ALT, DELETE, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, space, exec, $menu
bind = $mainMod, P, pseudo,
# bind = $mainMod, EQUAL, togglesplit,
bind = $mainMod, F, fullscreen, 0 
bind = SUPER_SHIFT, F, togglefloating,

bind = SUPER_SHIFT , P, pin


# Vim-style focus (h,j,k,l)
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Swap windows (ALT + h,j,k,l)
bind = ALT, h, swapwindow, l
bind = ALT, l, swapwindow, r
bind = ALT, k, swapwindow, u
bind = ALT, j, swapwindow, d
bind = SHIFT_ALT, l , movecurrentworkspacetomonitor, +1
bind = SHIFT_ALT, h , movecurrentworkspacetomonitor, -1
# Monitor Focus
bind = SUPER_SHIFT, h, focusmonitor, l
bind = SUPER_SHIFT, l, focusmonitor, r

# Hyprshot (Print and Insert keys)
bind = , PRINT, exec, hyprshot -m window -o ~/Pictures/screenshots
bind = SHIFT, PRINT, exec, hyprshot -m region -o ~/Pictures/screenshots
bind = , INSERT, exec, hyprshot -m window -o ~/Pictures/screenshots
bind = SHIFT, INSERT, exec, hyprshot -m region -o ~/Pictures/screenshots
bind = CTRL, INSERT, exec, hyprshot -m output -o ~/Pictures/screenshots

# Lock
bind = ALT_CTRL, l, exec, hyprlock

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Workspace Tab Navigation
bind = $mainMod, TAB, workspace, e+1 
bind = SUPER_SHIFT, TAB, workspace, e-1 

bind = ALT_SHIFT, L, movetoworkspace, r+1
bind = ALT_SHIFT, H, movetoworkspace, r-1


# Special Workspace (Scratchpad)
bind = $mainMod, S, togglespecialworkspace, special 
bind = $mainMod SHIFT, S, movetoworkspace, special

# Resize active windows (CTRL + h,j,k,l)
bind = $mainMod CTRL, h, resizeactive, -20 0
bind = $mainMod CTRL, l, resizeactive, 20 0
bind = $mainMod CTRL, k, resizeactive, 0 -20
bind = $mainMod CTRL, j, resizeactive, 0 20
bind = $mainMod CTRL, EQUAL, resizeactive, exact 50% 100%

#  Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#Multimedia 
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

# Screen Brightness Controls
bindel = , XF86MonBrightnessUp, exec, brightnessctl -d amdgpu_bl1 set 5%+ && pkill -RTMIN+10 waybar
bindel = , XF86MonBrightnessDown, exec, brightnessctl -d amdgpu_bl1 set 5%- && pkill -RTMIN+10 waybar



##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize

}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

misc {
    force_default_wallpaper = 0 # Set to 0 to disable the default mascot
    disable_hyprland_logo = true
}

