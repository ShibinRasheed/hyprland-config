background {
    monitor =
    path = screenshot
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill
    outer_color = rgba(165, 110, 212,1.0) 
    # check_color=rgba(00ff99ee) rgba(ff6633ee) 120deg

    check_color=rgba(ff6633ee) rgba(ff0066ee) 40deg
    fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(255,255,255)
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center

    fail_text = Nee ethada?

}
